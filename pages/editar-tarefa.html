<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sistema Gerenciador de Tarefas">
    <title>Editar Tarefa | Sistema Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <input type="checkbox" id="tema" class="controle-tema">
    <label for="tema" class="botao-tema" aria-label="Alternar tema" title="Alternar tema">
        <span class="icone-claro" aria-hidden="true">☀️</span>
        <span class="icone-escuro" aria-hidden="true">🌙</span>
    </label>

    <div class="pagina pagina-interna">
        <div class="layout-interno">
            <aside class="sidebar">
                <h2>Sistema de Gerenciamento de Tarefas</h2>
                <nav class="navegacao" aria-label="Navegação principal">
                    <ul>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="dashboard.html">Minhas Tarefas</a></li>
                        <li><a href="criar-tarefa.html">Criar Tarefa</a></li>
                        <li><a href="#">Configurações</a></li>
                        <li><a href="../index.html">Sair</a></li>
                    </ul>
                </nav>
                <p class="sidebar-rodape">© 2026 Projeto Acadêmico</p>
            </aside>
            <main class="conteudo-interno">
                <header class="cabecalho-interno">
                    <h1>Editar Tarefa</h1>
                </header>

                <section class="cartao cartao-formulario" aria-labelledby="titulo-editar">
                    <h2 id="titulo-editar" class="titulo-cartao">Editar Tarefa</h2>

                    <form id="formulario-editar" action="detalhes.html" method="get" novalidate>
                        <div class="grupo-formulario">
                            <label for="titulo">Título da Tarefa</label>
                            <input class="campo" type="text" id="titulo" name="titulo"
                                value="Revisar proposta do cliente">
                        </div>

                        <div class="grupo-formulario">
                            <label for="descricao">Descrição (Opcional)</label>
                            <textarea class="campo" id="descricao"
                                name="descricao">Revisar a proposta enviada pelo cliente e verificar todas as informações antes de encaminhar a versão final.</textarea>
                        </div>

                        <div class="grupo-formulario">
                            <label for="situacao">Situação da Tarefa</label>
                            <select class="campo" id="situacao" name="situacao">
                                <option value="pendente" selected>Pendente</option>
                                <option value="em-andamento">Em andamento</option>
                                <option value="concluida">Concluída</option>
                            </select>
                        </div>

                        <div class="acoes-formulario">
                            <button class="botao botao-primario" type="submit">Atualizar Tarefa</button>
                            <a class="botao botao-secundario" href="dashboard.html">Cancelar</a>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('formulario-editar').addEventListener('submit', function(event) {
            const titulo = document.getElementById('titulo').value.trim();
            const descricao = document.getElementById('descricao').value.trim();

            // Expressão regular para verificar se possui pelo menos 5 caracteres
            const regexTitulo = /^.{5,}$/;

            // Expressão regular para verificar se possui pelo menos 3 caracteres (aplicada caso não esteja vazio)
            const regexDescricao = /^.{3,}$/;

            if (!regexTitulo.test(titulo)) {
                event.preventDefault();
                alert('O campo Título deve ter pelo menos 5 posições.');
                return;
            }

            if (descricao.length > 0 && !regexDescricao.test(descricao)) {
                event.preventDefault();
                alert('O campo Descrição, se preenchido, deve ter pelo menos 3 posições.');
                return;
            }
        });
    </script>
</body>

</html>
