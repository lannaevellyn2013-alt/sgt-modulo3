<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sistema Gerenciador de Tarefas">
    <title>Cadastro | Sistema de Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <input type="checkbox" id="tema" class="controle-tema">
    <label for="tema" class="botao-tema" aria-label="Alternar tema" title="Alternar tema">
        <span class="icone-claro" aria-hidden="true">☀️</span>
        <span class="icone-escuro" aria-hidden="true">🌙</span>
    </label>

    <div class="pagina pagina-publica">
        <header class="cabecalho-publico">
            <p class="nome-sistema">Sistema de Gerenciamento de Tarefas</p>
        </header>
        <main class="conteudo-publico">
            <section class="cartao cartao-formulario" aria-labelledby="titulo-cadastro">
                <h1 id="titulo-cadastro" class="titulo-cartao">Crie sua Conta</h1>
                <form id="formulario-cadastro" action="../index.html" method="get" novalidate>
                    <div class="grupo-formulario">
                        <label for="nome">Nome</label>
                        <input class="campo" type="text" id="nome" name="nome" autocomplete="name">
                    </div>
                    <div class="grupo-formulario">
                        <label for="email">Email</label>
                        <input class="campo" type="email" id="email" name="email" autocomplete="email">
                    </div>
                    <div class="grupo-formulario">
                        <label for="senha">Senha</label>
                        <input class="campo" type="password" id="senha" name="senha" autocomplete="new-password">
                    </div>
                    <div class="acoes-formulario">
                        <button class="botao botao-primario" type="submit">Cadastrar</button>
                    </div>
                    <p class="link-formulario">Já tem uma conta? <a href="../index.html">Faça login</a></p>
                </form>
            </section>
        </main>
        <footer class="rodape-publico">
            <p>© 2026 Projeto Acadêmico | <a href="#">Termos de Uso</a></p>
        </footer>
    </div>

    <script>
        document.getElementById('formulario-cadastro').addEventListener('submit', function (event) {
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();

            // Expressão regular para o nome (mínimo 5 caracteres no total com pelo menos um espaço em branco intermediário)
            const regexNome = /^(?=.{5,}).+\s+.+$/;

            // Expressão regular para o email (<algo>@<algo>.com ou <algo>@<algo>.com.br)
            const regexEmail = /^[^@]+@[^@]+\.com(\.br)?$/;

            if (!regexNome.test(nome)) {
                event.preventDefault();
                alert('O campo Nome deve ter pelo menos 5 posições e um espaço em branco entre o nome e o sobrenome.');
                return;
            }

            if (!regexEmail.test(email)) {
                event.preventDefault();
                alert('O campo Email deve ser no formato <alguma_coisa>@<alguma_coisa>.com ou .com.br');
                return;
            }

            if (senha.length < 8) {
                event.preventDefault();
                alert('O campo Senha deve ter pelo menos 8 posições.');
                return;
            }
        });    
    </script>
</body>

</html>
