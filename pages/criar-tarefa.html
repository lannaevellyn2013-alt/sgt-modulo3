<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sistema Gerenciador de Tarefas">
    <title>Criar Tarefa | Sistema Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <input type="checkbox" id="tema" class="controle-tema">
    <label for="tema" class="botao-tema" aria-label="Alternar tema" title="Alternar tema">
        <span class="icone-claro" aria-hidden="true">☀️</span>
        <span class="icone-escuro" aria-hidden="true">🌙</span>
    </label>

    <div class="pagina pagina-interna">
        <div class="layout-interno">
            <aside class="sidebar">
                <h2>Sistema de Gerenciamento de Tarefas</h2>
                <nav class="navegacao" aria-label="Navegação principal">
                    <ul>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="dashboard.html">Minhas Tarefas</a></li>
                        <li><a href="criar-tarefa.html">Criar Tarefa</a></li>
                        <li><a href="#">Configurações</a></li>
                        <li><a href="../index.html">Sair</a></li>
                    </ul>
                </nav>
                <p class="sidebar-rodape">© 2026 Projeto Acadêmico</p>
            </aside>
            <main class="conteudo-interno">
                <header class="cabecalho-interno">
                    <h1>Criar Tarefa</h1>
                </header>

                <section class="cartao cartao-formulario" aria-labelledby="titulo-criar">
                    <div id="notificacao" class="notificacao"></div>
                    <h2 id="titulo-criar" class="titulo-cartao">Criar Tarefa</h2>

                    <form id="formulario-tarefa" action="dashboard.html" method="get" novalidate>
                        <div class="grupo-formulario">
                            <label for="titulo">Título da Tarefa</label>
                            <input class="campo" type="text" id="titulo" name="titulo">
                        </div>

                        <div class="grupo-formulario">
                            <label for="descricao">Descrição (Opcional)</label>
                            <textarea class="campo" id="descricao" name="descricao"></textarea>
                        </div>

                        <div class="acoes-formulario">
                            <button class="botao botao-primario" type="submit">Salvar Tarefa</button>
                            <a class="botao botao-secundario" href="dashboard.html">Cancelar</a>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script>

        function mostrarNotificacao(mensagem, tipo = 'sucesso') {
            const notificacao = document.getElementById('notificacao');
            notificacao.textContent = mensagem;
            notificacao.className = `notificacao ${tipo}`;
            // Esconde a notificação após 3 segundos
            setTimeout(() => {
                notificacao.className = 'notificacao';
            }, 3000);
        }

        document.getElementById('formulario-tarefa').addEventListener('submit', function(event) {

            // Sempre cancela o envio automático para podermos controlar o fluxo via JS
            event.preventDefault();

            const titulo = document.getElementById('titulo').value.trim();
            const descricao = document.getElementById('descricao').value.trim();

            if (titulo.length < 5) {
                event.preventDefault();
                alert('O campo Título deve ter pelo menos 5 posições.');
                return;
            }

            if (descricao.length > 0 && descricao.length < 3) {
                event.preventDefault();
                alert('O campo Descrição, se preenchido, deve ter pelo menos 3 posições.');
                return;
            }
            
            // Agora a página não vai recarregar e a notificação ficará visível!
            mostrarNotificacao('Tarefa criada!');

            // Aguarda 3 segundos (tempo da mensagem) e redireciona para a dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 3000);
        });
    </script>
</body>

</html>
